<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포켓몬 마을 & 타운 매니저</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- 상단 트레이너 프로필 & 재화 바 -->
    <header class="top-bar">
      <div class="profile-info">
        <span class="trainer-name" id="trainerName">한지우</span>
        <span class="rank-badge" id="trainerRank">Z-Rank</span>
      </div>
      <div class="resource-bar">
        <div class="resource-item">💎 <span id="resGem">500</span></div>
        <div class="resource-item">🪙 <span id="resGold">1000</span></div>
        <div class="resource-item">🍬 <span id="resCandy">50</span></div>
      </div>
      <button class="nav-home-btn" onclick="switchTab('village')">🏰 마을로</button>
    </header>

    <!-- 메인 컨텐츠 영역 (시설별 탭) -->
    <main class="content-area">
      
      <!-- 1. 마을 탭 -->
      <section id="tab-village" class="facility-panel active">
        <div class="village-header">
          <h2>🏰 라이브 마을 필드</h2>
          <p>원하는 건물을 선택하여 시설로 이동하세요.</p>
        </div>
        <div id="village2dField" class="village-2d-field">
          <div class="ambient-clouds">
            <div class="cloud cloud-1"></div>
            <div class="cloud cloud-2"></div>
            <div class="cloud cloud-3"></div>
          </div>
          <div id="buildingNodesContainer" class="building-nodes-container"></div>
        </div>
      </section>

      <!-- 2. 파티 & 인벤토리 탭 -->
      <section id="tab-party" class="facility-panel">
        <div class="panel-header">
          <h2>🎒 파티 & 인벤토리 관리</h2>
          <button class="back-btn" onclick="switchTab('village')">⬅ 마을로</button>
        </div>
        <div class="squad-section">
          <h3>⚔️ 배틀 출전 엔트리 (최대 6마리)</h3>
          <div class="squad-row-group">
            <div class="squad-row-label">전열 (Front)</div>
            <div id="squadFrontContainer" class="squad-grid"></div>
          </div>
          <div class="squad-row-group" style="margin-top: 15px;">
            <div class="squad-row-label">후열 (Back)</div>
            <div id="squadBackContainer" class="squad-grid"></div>
          </div>
        </div>
        <hr class="divider">
        <div class="inventory-section">
          <h3>📦 보유한 포켓몬 목록</h3>
          <div id="partyInventoryContainer" class="inventory-grid"></div>
        </div>
      </section>

      <!-- 3. 체육관 탭 -->
      <section id="tab-gym" class="facility-panel">
        <div class="panel-header">
          <h2>⚔️ 포켓몬 체육관 (Z-Rank)</h2>
          <button class="back-btn" onclick="switchTab('village')">⬅ 마을로</button>
        </div>
        <div id="gymContentContainer" class="facility-content"></div>
      </section>

      <!-- 4. 프렌들리숍 탭 -->
      <section id="tab-mart" class="facility-panel">
        <div class="panel-header">
          <h2>🛒 프렌들리숍</h2>
          <button class="back-btn" onclick="switchTab('village')">⬅ 마을로</button>
        </div>
        <div id="martContentContainer" class="facility-content"></div>
      </section>

      <!-- 5. 포켓몬 키우미집 탭 -->
      <section id="tab-daycare" class="facility-panel">
        <div class="panel-header">
          <h2>🍬 포켓몬 키우미집</h2>
          <button class="back-btn" onclick="switchTab('village')">⬅ 마을로</button>
        </div>
        <div id="daycareContentContainer" class="facility-content"></div>
      </section>

      <!-- 6. 오박사 연구소 탭 -->
      <section id="tab-lab" class="facility-panel">
        <div class="panel-header">
          <h2>🎲 오박사 연구소 (포켓몬 채용)</h2>
          <button class="back-btn" onclick="switchTab('village')">⬅ 마을로</button>
        </div>
        <div id="labContentContainer" class="facility-content"></div>
      </section>

      <!-- 7. 전국 도감 타워 탭 -->
      <section id="tab-dex" class="facility-panel">
        <div class="panel-header">
          <h2>📖 전국 도감 타워</h2>
          <button class="back-btn" onclick="switchTab('village')">⬅ 마을로</button>
        </div>
        <div id="dexContentContainer" class="facility-content"></div>
      </section>

    </main>
  </div>

  <!-- 파티 출전 선택 모달 -->
  <div id="squadSelectModal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h3 id="modalSlotTitle">출전 포켓몬 선택</h3>
        <button class="close-btn" onclick="closeSquadModal()" style="background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer;">✕</button>
      </div>
      <div id="modalPokeList" class="modal-poke-list"></div>
    </div>
  </div>

  <!-- 필수 스크립트 4종 연결 -->
  <script src="src/data/pokemon.js"></script>
  <script src="src/engine/state.js"></script>
  <script src="src/engine/village.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
